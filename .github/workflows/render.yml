name: Render episode

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Episode folder name under episodes/"
        required: true
        default: nokia-intro
      map_style:
        description: "Map style override: satellite | atlas | midnight (empty = script / default)"
        required: false
        default: ""
      stills:
        description: "Only render these frames as JPEG stills (e.g. 0,240,12.5s); empty = full video"
        required: false
        default: ""
      thumbnails:
        description: "Make the 3 thumbnail variants"
        type: boolean
        default: true
      storyboard:
        description: "Only a storyboard: one still per shot / map stop on contact sheets (no video)"
        type: boolean
        default: false
      thumbs_only:
        description: "Only the thumbnails (own-imagery variant D) to an artifact: no video, no release"
        type: boolean
        default: false
      pace_samples:
        description: "Also write the opening narration at three speeds (pace_samples/) to the stills / storyboard artifact"
        type: boolean
        default: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write  # publish the finished episode as a private release
    env:
      GH_TOKEN: ${{ github.token }}
      SLUG: ${{ inputs.slug }}
      MAP_STYLE: ${{ inputs.map_style }}
      STILLS: ${{ inputs.stills }}
      PACE_SAMPLES: ${{ inputs.pace_samples && '1' || '0' }}
      OUT_NAME: ${{ inputs.slug }}${{ inputs.map_style != '' && format('-{0}', inputs.map_style) || '' }}${{ inputs.stills != '' && '-stills' || '' }}${{ inputs.storyboard && '-storyboard' || '' }}${{ inputs.thumbs_only && '-thumbs' || '' }}
      YTP_CACHE_DIR: ${{ github.workspace }}/.cache
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      # Licence caution: hosted FLUX.2 klein terms are unclear for third-party hosts, so use schnell.
      CF_IMAGE_MODEL: "@cf/black-forest-labs/flux-1-schnell"
    steps:
      - name: Start clock
        run: echo "RUN_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      # Assets (Pexels clips, AI images, TTS, captions, ledgers). Restore here; saved in the final
      # `if: always()` steps so a failed/timed-out run keeps its expensive work (TTS, images).
      # A unique key per run + prefix restore means the cache grows incrementally.
      - name: Restore asset cache
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: assets-${{ github.run_id }}
          restore-keys: assets-

      - name: Restore model cache (Kokoro + Whisper)
        id: hf
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 \
            libcairo2 libpango-1.0-0 libatk-bridge2.0-0

      - name: Python dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r pipeline/requirements.txt

      - name: Node dependencies
        working-directory: remotion
        run: npm ci --no-audit --no-fund

      - name: Prepare (TTS, captions, media, audio, timeline)
        run: python pipeline/run.py prepare "$SLUG"

      - name: Render stills (Remotion)
        if: inputs.stills != ''
        working-directory: remotion
        run: |
          node stills.mjs "../build/$SLUG/timeline.json" "../out/$SLUG/stills" "$STILLS"
          cp "../build/$SLUG/timeline.json" "../out/$SLUG/stills/"

      - name: Storyboard (one still per shot and map stop)
        if: inputs.storyboard
        run: |
          python pipeline/run.py storyboard "$SLUG"
          (cd remotion && node stills.mjs "../build/$SLUG/timeline.json" "../build/$SLUG/sb" "$(cat ../build/$SLUG/storyboard_frames.txt)")
          python tools/contact_sheet.py "build/$SLUG/storyboard.json" "build/$SLUG/sb" "out/$SLUG/storyboard"
          cp "build/$SLUG/timeline.json" "out/$SLUG/storyboard/"

      - name: Render video (Remotion)
        if: inputs.stills == '' && !inputs.storyboard && !inputs.thumbs_only
        working-directory: remotion
        run: |
          npx remotion render src/index.ts Episode "../build/$SLUG/video.mp4" \
            --props="../build/$SLUG/timeline.json" \
            --codec=h264 --crf=20 --x264-preset=veryfast \
            --concurrency=2 --image-format=jpeg --jpeg-quality=88 --muted --log=info

      - name: Thumbnails (3 variants)
        if: inputs.thumbs_only || (inputs.stills == '' && !inputs.storyboard && inputs.thumbnails)
        run: |
          python pipeline/run.py thumbnails "$SLUG"
          if [ "${{ inputs.thumbs_only }}" = "true" ]; then mkdir -p "out/$SLUG" && cp -r "build/$SLUG/thumbnails" "out/$SLUG/"; fi

      - name: Finalize (mux audio, collect outputs)
        if: inputs.stills == '' && !inputs.storyboard && !inputs.thumbs_only
        run: python pipeline/run.py finalize "$SLUG"

      - name: Publish private release (the PC downloads it from there)
        if: inputs.stills == '' && !inputs.storyboard && !inputs.thumbs_only
        run: |
          TAG="ep-$SLUG-$GITHUB_RUN_ID"
          OUT="out/$SLUG"
          cp "$OUT/final.mp4" "$OUT/$OUT_NAME.mp4"
          MIN=$(( ( $(date +%s) - RUN_START ) / 60 + 1 ))
          SIZE=$(du -m "$OUT/final.mp4" | cut -f1)
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$OUT/final.mp4" | cut -d. -f1)
          {
            echo "Episode: $SLUG"
            echo "Video: ${DUR} s, ${SIZE} MB. Actions time until publish: about ${MIN} min."
            echo
            echo "Download (PowerShell): gh release download $TAG -R $GITHUB_REPOSITORY -D \"\$env:USERPROFILE\Videos\yt-pipeline\\$SLUG\""
          } > notes.md
          cp "build/$SLUG/timeline.json" "$OUT/timeline.json"
          gh release create "$TAG" "$OUT/$OUT_NAME.mp4" "$OUT/youtube.txt" "$OUT/credits.txt" "$OUT/timeline.json" $(ls "$OUT"/thumbnails/*.jpg 2>/dev/null)             --prerelease --title "$OUT_NAME $(date -u +%F)" --notes-file notes.md
          echo "Release: $TAG (${DUR} s, ${SIZE} MB)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact (stills / storyboard, 2-day retention)
        if: inputs.stills != '' || inputs.storyboard || inputs.thumbs_only
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUT_NAME }}
          path: out/${{ env.SLUG }}
          retention-days: 2
          if-no-files-found: error

      - name: Save asset cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache
          key: assets-${{ github.run_id }}

      - name: Save model cache
        if: always() && steps.hf.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1

      - name: Minutes summary
        if: always()
        run: |
          MIN=$(( ( $(date +%s) - RUN_START ) / 60 + 1 ))
          {
            echo "### $OUT_NAME"
            echo "- Job time: about $MIN min (GitHub bills each started minute)"
            if [ -f "build/$SLUG/timings_prepare.json" ]; then echo "- Prepare steps (s): $(cat build/$SLUG/timings_prepare.json)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
