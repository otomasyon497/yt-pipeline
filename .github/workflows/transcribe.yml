name: Transcribe reference audio

# Speech-to-text for reference videos the user shares (script analysis). The audio is uploaded by hand to
# the private "inputs" release; nothing heavy runs on the user's PC.
on:
  workflow_dispatch:
    inputs:
      asset:
        description: "File name in the 'inputs' release"
        required: true
      language:
        description: "Language code (empty = detect)"
        required: false
        default: ""
      model:
        description: "Whisper model"
        required: false
        default: small

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASSET: ${{ inputs.asset }}
      LANG_CODE: ${{ inputs.language }}
      MODEL: ${{ inputs.model }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Restore Whisper model cache
        id: hf
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/huggingface
          key: hf-whisper-${{ inputs.model }}-v1
      - name: Install
        run: pip install faster-whisper
      - name: Download audio
        run: gh release download inputs --pattern "$ASSET" --dir in
      - name: Transcribe
        run: |
          mkdir -p out
          python tools/transcribe.py "in/$ASSET" "out/transcript.txt" --model "$MODEL" ${LANG_CODE:+--language "$LANG_CODE"}
      - uses: actions/upload-artifact@v7
        with:
          name: transcript
          path: out/transcript.txt
          retention-days: 2
      - name: Save Whisper model cache
        if: always() && steps.hf.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/huggingface
          key: hf-whisper-${{ inputs.model }}-v1
